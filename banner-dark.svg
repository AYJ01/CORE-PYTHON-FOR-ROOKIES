<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Python for Beginners. Learn Python 3 from first principles to professional systems." xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.t{fill:#e6edf3;font-size:54px;font-weight:700;letter-spacing:-1px}
.s{fill:#7d8590;font-size:18px}
.p{fill:#e6edf3;font-size:22px}
.m{fill:#7d8590;font-size:14px;letter-spacing:1px}
.frame{fill:none;stroke:#e6edf3;stroke-width:1.2;stroke-dasharray:2900;stroke-dashoffset:2900;animation:draw 1.8s ease-out forwards}
.dots{animation:breathe 6s ease-in-out infinite}
.rise{opacity:0;animation:rise .9s ease-out forwards}
.d1{animation-delay:.5s}.d2{animation-delay:.8s}.d3{animation-delay:1.1s}
.type{animation:type 7s steps(25) 1.6s infinite}
.cur{animation:blink 1s steps(1) infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes type{0%{width:0}40%,88%{width:340px}100%{width:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.frame{stroke-dashoffset:0}.rise{opacity:1}.type{width:340px}}
</style>
<defs>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#7d8590"/></pattern>
<linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="mk"><rect x="560" y="0" width="640" height="280" fill="url(#f)"/></mask>
<clipPath id="c"><rect class="type" x="60" y="200" width="0" height="40"/></clipPath>
</defs>
<rect x="0.6" y="0.6" width="1198.8" height="278.8" rx="14" fill="#0d1117"/>
<g mask="url(#mk)"><rect class="dots" x="560" y="0" width="640" height="280" fill="url(#g)"/></g>
<rect class="frame" x="0.6" y="0.6" width="1198.8" height="278.8" rx="14" stroke-opacity=".55"/>
<text class="m rise d1" x="60" y="62">~/python-for-beginners</text>
<text class="t rise d2" x="60" y="130">Python for Beginners</text>
<text class="s rise d3" x="60" y="168">Learn Python 3 from first principles to professional systems.</text>
<g clip-path="url(#c)"><text class="p" x="60" y="224">&gt;&gt;&gt; print("hello, world")</text></g>
<rect class="cur" x="404" y="206" width="11" height="22" fill="#e6edf3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
